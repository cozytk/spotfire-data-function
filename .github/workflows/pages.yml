# 이 워크플로는 Pages 소스를 "GitHub Actions" 로 설정한 경우에만 사용합니다.
#
# 기본 설정("Deploy from a branch")에서는 GitHub 이 자체 빌더로 docs/ 를 빌드하므로
# 이 워크플로가 필요하지 않습니다. (그 상태에서 실행하면 배포 단계에서 실패합니다.)
# 그래서 자동 트리거 없이 수동 실행(workflow_dispatch)만 열어 두었습니다.
name: Deploy docs to GitHub Pages (Actions 소스 전용)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebuild example pages from examples/
        run: |
          pip install pyyaml
          python scripts/build_docs.py

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: docs

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        working-directory: docs
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
